# Runtime config for the native interactive-session harness
# (hydrogen_interactive_harness.cpp, see that file and `just
# run-interactive`). Plain "key = value" lines; "#" starts a comment.
# Read fresh on every session start -- no rebuild needed to change these.

# Real cycles/sec to pace the simulation to, via sleep-based throttling --
# this is clk_i's effective real-world frequency. Set to 0 to disable
# throttling and run flat-out (fastest; raw Verilator eval ceiling measured
# ~13M cycles/sec on this design, vs. the ~390k/sec the old cocotb-driven
# harness topped out at).
throttle_cycles_per_sec = 10000000

# How often (in simulated clock cycles) to check for a new client
# connection, poll the socket for host input, and consider a throttle
# sleep -- not every cycle, so this bookkeeping doesn't itself dominate
# wall-clock time at high throttle rates. Byte arrival doesn't need
# cycle-exact timing (the virtual TX phy paces the actual bit timing once
# a byte is queued), so a few thousand cycles of granularity is fine.
housekeeping_every_cycles = 4096

# How often (real wall-clock seconds) to log a cycles-simulated/throughput
# status line. Set to 0 to disable.
throughput_report_s = 5.0
